        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        ::selection {
            background: rgba(139, 123, 255, 0.4);
            color: #fff;
        }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* ============ Base ============ */
        body {
            margin: 0;
            font-family: var(--sans);
            font-size: 1rem;
            line-height: 1.65;
            color: var(--text);
            background-color: var(--bg);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Aurora — two soft blobs, animated with transform only (GPU-friendly) */
        body::before {
            content: '';
            position: fixed;
            inset: -20vh -20vw;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(38vw 38vw at 22% 18%, rgba(139, 123, 255, 0.16), transparent 70%),
                radial-gradient(34vw 34vw at 80% 12%, rgba(62, 230, 224, 0.10), transparent 70%),
                radial-gradient(40vw 40vw at 65% 85%, rgba(255, 107, 193, 0.07), transparent 70%);
            animation: aurora 26s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes aurora {
            from {
                transform: translate3d(-2%, -1%, 0) scale(1) rotate(0.001deg);
            }

            to {
                transform: translate3d(2%, 2%, 0) scale(1.08) rotate(0.001deg);
            }
        }

        /* Faint blueprint grid, fading out towards the bottom */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
            background-size: 54px 54px;
            -webkit-mask-image: radial-gradient(120% 90% at 50% 0%, #000 30%, transparent 90%);
            mask-image: radial-gradient(120% 90% at 50% 0%, #000 30%, transparent 90%);
        }

        /* ============ Layout ============ */
        .container {
            width: 100%;
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 0 var(--pad-x);
        }

        .section {
            padding: 3.75rem 0;
        }

        main {
            counter-reset: sec;
        }

        /* ============ Header ============ */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(6, 7, 12, 0.72);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        #progress {
            position: absolute;
            left: 0;
            bottom: -1px;
            height: 2px;
            width: 100%;
            background: var(--grad);
            transform: scaleX(0);
            transform-origin: 0 50%;
            pointer-events: none;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 62px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--text);
            text-decoration: none;
        }

        .brand .dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--grad);
            box-shadow: 0 0 14px rgba(139, 123, 255, 0.9);
            animation: breathe 3.2s ease-in-out infinite;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.35);
            }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.92rem;
            padding: 0.45rem 0.75rem;
            border-radius: 9px;
            transition: color 0.25s ease, background-color 0.25s ease;
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-links a[download] {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.84rem;
        }

        .nav-links a[download]::before {
            content: '';
            width: 0.9em;
            height: 0.9em;
            background: currentColor;
            -webkit-mask: var(--i-dl) center / contain no-repeat;
            mask: var(--i-dl) center / contain no-repeat;
        }

        .nav-links a[download]:hover {
            border-color: rgba(139, 123, 255, 0.6);
            box-shadow: 0 0 18px rgba(139, 123, 255, 0.25);
        }

        /* ============ Hero ============ */
        .hero {
            padding: 5.5rem 0 2.5rem;
        }

        .hero-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: clamp(1.75rem, 4vw, 3rem);
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 123, 255, 0.85), rgba(62, 230, 224, 0.6), transparent);
        }

        .hero-card::after {
            content: '';
            position: absolute;
            top: -30%;
            right: -12%;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 123, 255, 0.13) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero-eyebrow {
            font-family: var(--mono);
            font-size: 0.88rem;
            color: var(--faint);
            margin-bottom: 1.1rem;
        }

        .hero-eyebrow .path {
            color: var(--cyan);
        }

        .hero-eyebrow .dollar {
            color: var(--pink);
        }

        .blink {
            display: inline-block;
            margin-left: 2px;
            color: var(--cyan);
            animation: blink 1.1s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        .hero-title {
            margin: 0 0 0.6rem;
            font-size: clamp(2.4rem, 6.5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.05;
        }

        .grad-text {
            background: var(--grad);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradShift 9s ease-in-out infinite alternate;
        }

        @keyframes gradShift {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 100% 50%;
            }
        }

        .hero-subtitle {
            font-family: var(--mono);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: var(--muted);
            margin: 0 0 1.4rem;
        }

        .hero-subtitle::before {
            content: '<';
            color: var(--faint);
            margin-right: 0.4ch;
        }

        .hero-subtitle::after {
            content: '/>';
            color: var(--faint);
            margin-left: 0.4ch;
        }

        .hero-desc {
            color: var(--muted);
            max-width: 64ch;
            margin: 0 0 1.75rem;
            font-size: 1.02rem;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .hero-actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.55rem 1.05rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: transform 0.25s var(--ease-out), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        .hero-actions a:hover {
            transform: translateY(-2px);
            border-color: rgba(139, 123, 255, 0.6);
            box-shadow: 0 6px 24px rgba(139, 123, 255, 0.22);
        }

        .hero-actions a:first-child {
            background: var(--grad);
            border-color: transparent;
            color: #06070c;
            font-weight: 700;
        }

        .hero-actions a:first-child:hover {
            box-shadow: 0 8px 30px rgba(139, 123, 255, 0.45);
        }

        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: var(--mono);
            font-size: 0.74rem;
            color: var(--muted);
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.025);
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
        }

        .badge-ai {
            color: #cfc8ff;
            border-color: rgba(139, 123, 255, 0.35);
        }

        .pulse-dot {
            position: relative;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #4ade80;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 999px;
            border: 1px solid #4ade80;
            animation: ping 2s var(--ease-out) infinite;
        }

        @keyframes ping {
            from {
                transform: scale(0.6);
                opacity: 0.9;
            }

            to {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* ============ AI summary ============ */
        .ai-resume {
            padding: 1.25rem 0;
        }

        .ai-resume-inner {
            position: relative;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 1.5rem 1.75rem;
            background:
                linear-gradient(var(--bg-elev), var(--bg-elev)) padding-box,
                linear-gradient(120deg, rgba(62, 230, 224, 0.55), rgba(139, 123, 255, 0.55), rgba(255, 107, 193, 0.45)) border-box;
            box-shadow: 0 0 44px rgba(139, 123, 255, 0.10);
        }

        .ai-resume-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.9rem;
        }

        .ai-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.32rem 0.8rem;
            border-radius: 999px;
            background: rgba(139, 123, 255, 0.14);
            border: 1px solid rgba(139, 123, 255, 0.4);
            color: #d6d0ff;
            font-family: var(--mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .ai-chip::before {
            content: '';
            width: 1em;
            height: 1em;
            background: currentColor;
            -webkit-mask: var(--i-spark) center / contain no-repeat;
            mask: var(--i-spark) center / contain no-repeat;
        }

        .ai-q {
            font-family: var(--mono);
            font-size: 0.82rem;
            color: var(--faint);
            font-style: italic;
        }

        .ai-q::before {
            content: '> ';
            color: var(--cyan);
            font-style: normal;
        }

        .ai-resume-body p {
            margin: 0 0 0.6rem;
            color: #dfe3f0;
            font-size: 1.02rem;
            line-height: 1.7;
        }

        .ai-resume-body p:last-child {
            margin-bottom: 0;
        }

        .caret {
            display: inline-block;
            width: 0.55ch;
            height: 1.05em;
            margin-left: 2px;
            background: var(--cyan);
            vertical-align: text-bottom;
            animation: blink 1s steps(2, start) infinite;
        }

        .ai-note {
            margin-top: 0.9rem;
            font-family: var(--mono);
            font-size: 0.76rem;
            color: var(--faint);
        }

        /* ============ Section headings ============ */
        .section h2 {
            counter-increment: sec;
            font-size: clamp(1.7rem, 3.4vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 2.2rem;
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
        }

        .section h2::before {
            content: '0' counter(sec);
            font-family: var(--mono);
            font-size: 0.55em;
            font-weight: 600;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(139, 123, 255, 0.4), transparent);
            transform: translateY(-0.35em);
        }

        /* ============ Cards / Skills ============ */
        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.4rem;
            transition: transform 0.3s var(--ease-out), border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background: var(--card-bg-hover);
            border-color: rgba(139, 123, 255, 0.4);
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.35), 0 0 24px rgba(139, 123, 255, 0.10);
        }

        .skill-group-wide {
            grid-column: 1 / -1;
        }

        .skill-group h3 {
            margin: 0 0 1rem;
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--muted);
        }

        .skill-group h3::before {
            content: '▸ ';
            color: var(--violet);
        }

        .skill-group ul {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .skill-group li {
            font-family: var(--mono);
            font-size: 0.82rem;
            color: var(--muted);
            padding: 0.38rem 0.8rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            transition: transform 0.2s var(--ease-out), border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }

        .skill-group li:hover {
            transform: translateY(-2px);
            color: #fff;
            border-color: rgba(62, 230, 224, 0.55);
            box-shadow: 0 4px 16px rgba(62, 230, 224, 0.15);
        }

        /* The AI/LLM skill card gets the spotlight */
        .skill-group-ai {
            border: 1px solid transparent;
            background:
                linear-gradient(var(--bg-elev), var(--bg-elev)) padding-box,
                linear-gradient(120deg, rgba(62, 230, 224, 0.5), rgba(139, 123, 255, 0.55), rgba(255, 107, 193, 0.45)) border-box;
        }

        .skill-group-ai h3::before {
            content: '✦ ';
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .skill-group-ai li:hover {
            border-color: rgba(255, 107, 193, 0.55);
            box-shadow: 0 4px 16px rgba(255, 107, 193, 0.18);
        }

        /* ============ Timeline ============ */
        .timeline {
            position: relative;
            display: grid;
            gap: 1.1rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            border-radius: 2px;
            background: linear-gradient(180deg, var(--cyan), var(--violet) 45%, transparent);
            opacity: 0.45;
        }

        .timeline-item {
            position: relative;
            padding-left: 2.2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 1.45rem;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: var(--bg);
            border: 2px solid var(--violet);
            box-shadow: 0 0 12px rgba(139, 123, 255, 0.7);
            z-index: 1;
        }

        .timeline-item:first-child::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1.45rem;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            border: 2px solid var(--cyan);
            animation: ping 2.4s var(--ease-out) infinite;
        }

        .timeline-card {
            padding: 1.25rem 1.4rem;
        }

        .timeline-card h4 {
            margin: 0 0 0.5rem;
            font-size: 1.12rem;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .timeline-card h4 strong {
            font-weight: inherit;
            color: inherit;
        }

        .timeline-card p {
            margin: 0 0 0.8rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .timeline-card p:last-child {
            margin-bottom: 0;
        }

        .timeline-card .period em,
        .timeline-card h4+p em {
            display: inline-block;
            font-style: normal;
            font-family: var(--mono);
            font-size: 0.76rem;
            color: var(--cyan);
            background: rgba(62, 230, 224, 0.07);
            border: 1px solid rgba(62, 230, 224, 0.25);
            border-radius: 7px;
            padding: 0.16rem 0.6rem;
        }

        /* ============ Links (content) ============ */
        a {
            color: #b9aeff;
        }

        p a,
        .ai-resume-body a {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text);
            text-decoration: none;
            padding: 0.16rem 0.62rem;
            margin: 0.1rem 0.05rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            transition: transform 0.2s var(--ease-out), border-color 0.2s ease, box-shadow 0.2s ease;
            vertical-align: middle;
        }

        p a:hover,
        .ai-resume-body a:hover {
            transform: translateY(-2px);
            border-color: rgba(139, 123, 255, 0.6);
            box-shadow: 0 4px 16px rgba(139, 123, 255, 0.22);
        }

        /* icon per link type */
        p a::before,
        .ai-resume-body a::before,
        .hero-actions a::before {
            content: '';
            flex: none;
            width: 0.85em;
            height: 0.85em;
            background: currentColor;
            -webkit-mask: var(--i-ext) center / contain no-repeat;
            mask: var(--i-ext) center / contain no-repeat;
        }

        a[href^='#'] {
            --i-ext: var(--i-in);
        }

        a[href^='mailto:'] {
            --i-ext: var(--i-mail);
        }

        a[href*='github.com'] {
            --i-ext: var(--i-gh);
        }

        a[href*='linkedin.com'] {
            --i-ext: var(--i-li);
        }

        /* ============ Generic content ============ */
        #content h3 {
            font-size: 1.4rem;
            color: var(--text);
            margin: 2rem 0 1rem;
        }

        #content p {
            color: var(--muted);
            max-width: 80ch;
        }

        /* ============ Footer ============ */
        .site-footer {
            margin-top: 2rem;
            padding: 2.5rem 0 3rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .footer-main {
            margin: 0 0 0.5rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .footer-tip {
            margin: 0;
            font-family: var(--mono);
            font-size: 0.74rem;
            color: var(--faint);
        }

        /* ============ Reveal on scroll (JS adds .reveal, IO adds .in) ============ */
        .reveal {
            opacity: 0;
            transform: translateY(18px);
        }

        .reveal.in {
            opacity: 1;
            transform: none;
            transition: opacity 0.7s ease, transform 0.7s var(--ease-out);
        }

        /* ============ Responsive ============ */
        @media (max-width: 720px) {
            body {
                font-size: 0.95rem;
            }

            .hero {
                padding-top: 3rem;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .ai-q {
                display: none;
            }

            .nav-links a {
                padding: 0.4rem 0.55rem;
                font-size: 0.86rem;
            }

            .section {
                padding: 2.75rem 0;
            }
        }

        /* ============ Reduced motion ============ */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .reveal {
                opacity: 1;
                transform: none;
            }
        }

        /* ============ Print ============ */
        @media print {
            body {
                background: #fff;
                color: #000;
            }

            body::before,
            body::after,
            .site-header,
            .site-footer,
            #progress,
            .blink,
            .caret {
                display: none !important;
            }

            * {
                color: #000 !important;
                background: none !important;
                box-shadow: none !important;
                border-color: #ccc !important;
                animation: none !important;
            }

            a::before {
                display: none !important;
            }

            .grad-text {
                -webkit-text-fill-color: #000;
                color: #000;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container navbar">
            <a class="brand" href="#top" aria-label="Home">
                <span class="dot"></span>
                <span>Zic Juan</span>
            </a>
            <nav class="nav-links" aria-label="Primary">
                <a href="#skills">Skills</a>
                <a href="#experience">Experience</a>
                <a href="{{PDF_DOWNLOAD_URL}}" download aria-label="Download PDF">CV.pdf</a>
            </nav>
        </div>
        <div id="progress" aria-hidden="true"></div>
    </header>

    <main id="top">{{HTML_CV_CONTENT}}</main>

    <footer class="site-footer" id="contact">
        <div class="container">
            <p class="footer-main">© <span id="year"></span> Zic Juan — designed by a human, <span
                    class="grad-text">supercharged with LLMs</span>.</p>
            <p class="footer-tip">// psst — open the console</p>
        </div>
    </footer>

    <script>
        (function () {
            'use strict';
            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Current year
            var y = document.getElementById('year');
            if (y) y.textContent = String(new Date().getFullYear());

            // Scroll progress bar (rAF-throttled, transform only)
            var bar = document.getElementById('progress');
            if (bar) {
                var ticking = false;
                var update = function () {
                    var h = document.documentElement;
                    var max = h.scrollHeight - h.clientHeight;
                    bar.style.transform = 'scaleX(' + (max > 0 ? h.scrollTop / max : 0) + ')';
                    ticking = false;
                };
                window.addEventListener('scroll', function () {
                    if (!ticking) { ticking = true; requestAnimationFrame(update); }
                }, { passive: true });
                update();
            }

            // Reveal on scroll — content stays visible without JS
            if (!reduced && 'IntersectionObserver' in window) {
                var targets = document.querySelectorAll('.hero-card, .ai-resume-inner, .section h2, .card, .timeline-item');
                var io = new IntersectionObserver(function (entries) {
                    var i = 0;
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) return;
                        entry.target.style.transitionDelay = Math.min(i * 70, 350) + 'ms';
                        entry.target.classList.add('in');
                        io.unobserve(entry.target);
                        i++;
                    });
                }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
                targets.forEach(function (el) {
                    el.classList.add('reveal');
                    io.observe(el);
                });
            }

            // Typewriter for the LLM-generated summary
            var aiBody = document.querySelector('.ai-resume-body');
            if (aiBody && !reduced && 'IntersectionObserver' in window) {
                var paras = Array.prototype.slice.call(aiBody.querySelectorAll('p'));
                if (paras.length) {
                    var texts = paras.map(function (p) { return p.textContent; });
                    aiBody.style.minHeight = aiBody.offsetHeight + 'px';
                    paras.forEach(function (p) { p.textContent = ''; });
                    var caret = document.createElement('span');
                    caret.className = 'caret';
                    caret.setAttribute('aria-hidden', 'true');
                    var pi = 0, ci = 0, started = false;
                    var type = function () {
                        if (pi >= paras.length) { caret.remove(); return; }
                        ci++;
                        paras[pi].textContent = texts[pi].slice(0, ci);
                        paras[pi].appendChild(caret);
                        if (ci >= texts[pi].length) { pi++; ci = 0; setTimeout(type, 260); return; }
                        setTimeout(type, 9 + Math.random() * 22);
                    };
                    var aiIo = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting && !started) {
                                started = true;
                                aiIo.disconnect();
                                setTimeout(type, 350);
                            }
                        });
                    }, { threshold: 0.4 });
                    aiIo.observe(aiBody);
                }
            }

            // Easter egg for the curious
            try {
                console.log(
                    '%c✦ zic.ar',
                    'padding:6px 12px;border-radius:6px;background:linear-gradient(100deg,#3ee6e0,#8b7bff,#ff6bc1);color:#06070c;font-weight:700;font-size:14px',
                    '\n\nHand-built by Juan. The summary at the top? An LLM wrote it at\nbuild time from my README — and I reviewed every word.\n\nLLMs write drafts. Humans ship products.\n\n→ jzic@outlook.com'
                );
            } catch (e) { }
        })();
    </script>
</body>

</html>
